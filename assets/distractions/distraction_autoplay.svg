<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="ap-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9500" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ap-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="50%" stop-color="#ff9500"/>
      <stop offset="100%" stop-color="#ff3b30"/>
    </linearGradient>
    <linearGradient id="play-btn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>
    <filter id="ap-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff9500" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Radiant Aura -->
  <circle cx="64" cy="64" r="58" fill="url(#ap-glow)"/>

  <!-- Dark Disc Base -->
  <circle cx="64" cy="64" r="44" fill="#1c1c1e" stroke="#ffaa33" stroke-width="2" filter="url(#ap-shadow)"/>

  <!-- Segmented Buffering Outer Ring -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#ap-ring)" stroke-width="7" stroke-dasharray="24 8" stroke-linecap="round"/>

  <!-- Inner Countdown Track -->
  <circle cx="64" cy="64" r="28" fill="none" stroke="#3a3a3c" stroke-width="3"/>
  <!-- Progress Arc -->
  <path d="M 64 36 A 28 28 0 1 1 37 68" fill="none" stroke="#ffcc00" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Play Button Triangle -->
  <g transform="translate(68, 64)" filter="url(#ap-shadow)">
    <polygon points="-10,-16 16,0 -10,16" fill="url(#play-btn)" stroke="#ff9500" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
