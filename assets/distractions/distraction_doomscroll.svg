<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="ds-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#30d158" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ds-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34c759"/>
      <stop offset="100%" stop-color="#124f26"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
    <filter id="ds-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#34c759" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Aura -->
  <circle cx="64" cy="64" r="58" fill="url(#ds-glow)"/>

  <!-- Phone Container Chassis -->
  <g transform="translate(64, 64)" filter="url(#ds-shadow)">
    <rect x="-32" y="-48" width="64" height="96" rx="12" fill="url(#ds-frame)" stroke="#ffffff" stroke-width="2.5"/>
    <rect x="-27" y="-40" width="54" height="80" rx="6" fill="#0d1117"/>

    <!-- Feed Content Card 1 (Top) -->
    <g transform="translate(0, -24)">
      <rect x="-22" y="-12" width="44" height="22" rx="4" fill="url(#card-bg)" stroke="#3a3a3c" stroke-width="1"/>
      <circle cx="-14" cy="-4" r="4" fill="#ff3b30"/>
      <rect x="-6" y="-6" width="22" height="4" rx="2" fill="#8e8e93"/>
      <rect x="-14" y="3" width="30" height="3" rx="1.5" fill="#48484a"/>
    </g>

    <!-- Feed Content Card 2 (Middle - Active Post) -->
    <g transform="translate(0, 4)">
      <rect x="-22" y="-12" width="44" height="24" rx="4" fill="url(#card-bg)" stroke="#34c759" stroke-width="1.5"/>
      <!-- Media Thumbnail -->
      <rect x="-18" y="-8" width="18" height="16" rx="3" fill="#30d158" opacity="0.3"/>
      <polygon points="-11,-4 -11,4 -3,0" fill="#30d158"/>
      <!-- Text Lines -->
      <rect x="3" y="-6" width="15" height="3" rx="1.5" fill="#ffffff"/>
      <rect x="3" y="0" width="12" height="3" rx="1.5" fill="#8e8e93"/>
      <!-- Reaction Heart -->
      <path d="M 12 6 C 10 4 8 7 12 10 C 16 7 14 4 12 6 Z" fill="#ff3b30"/>
    </g>

    <!-- Downward Scroll Arrows -->
    <g transform="translate(0, 30)">
      <path d="M -8 -4 L 0 3 L 8 -4" fill="none" stroke="#34c759" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -8 2 L 0 9 L 8 2" fill="none" stroke="#30d158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    </g>
  </g>
</svg>
