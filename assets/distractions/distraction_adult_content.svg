<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="adult-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2d55" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff9500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="adult-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="50%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#5856d6"/>
    </linearGradient>
    <filter id="adult-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#ff2d55" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Radiant Hot Glow -->
  <circle cx="64" cy="64" r="58" fill="url(#adult-glow)"/>

  <!-- Main Octagon / Rounded Frame -->
  <rect x="22" y="22" width="84" height="84" rx="20" fill="url(#adult-body)" stroke="#ffffff" stroke-width="3" filter="url(#adult-shadow)"/>

  <!-- Centered Fire / Flame Core -->
  <g transform="translate(64, 64)">
    <path d="M 0 -24 C 12 -12 20 2 16 16 C 12 26 -12 26 -16 16 C -20 2 -12 -12 0 -24 Z" fill="#ffcc00" opacity="0.9"/>
    <path d="M 0 -14 C 8 -6 12 4 8 12 C 4 18 -8 18 -8 12 C -12 4 -8 -6 0 -14 Z" fill="#ffffff"/>
  </g>

  <!-- Pixelated Censorship Overlay Grid -->
  <g opacity="0.85" filter="url(#adult-shadow)">
    <!-- Row 1 -->
    <rect x="30" y="30" width="16" height="16" fill="#ff2d55"/>
    <rect x="48" y="30" width="16" height="16" fill="#ff9500" opacity="0.7"/>
    <rect x="66" y="30" width="16" height="16" fill="#ffcc00"/>
    <rect x="84" y="30" width="16" height="16" fill="#ff2d55" opacity="0.6"/>

    <!-- Row 2 -->
    <rect x="30" y="48" width="16" height="16" fill="#ff9500"/>
    <rect x="84" y="48" width="16" height="16" fill="#ff3b30"/>

    <!-- Row 3 -->
    <rect x="30" y="66" width="16" height="16" fill="#ffcc00" opacity="0.5"/>
    <rect x="84" y="66" width="16" height="16" fill="#ff9500"/>

    <!-- Row 4 -->
    <rect x="30" y="84" width="16" height="16" fill="#ff3b30" opacity="0.8"/>
    <rect x="48" y="84" width="16" height="16" fill="#ff2d55"/>
    <rect x="66" y="84" width="16" height="16" fill="#ff9500" opacity="0.7"/>
    <rect x="84" y="84" width="16" height="16" fill="#ffcc00"/>
  </g>

  <!-- Hazard Lock Symbol -->
  <path d="M 64 34 C 58 34 54 38 54 44 L 54 48 L 74 48 L 74 44 C 74 38 70 34 64 34 Z" fill="none" stroke="#ffffff" stroke-width="3"/>
</svg>
