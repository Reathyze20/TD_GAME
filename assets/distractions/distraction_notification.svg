<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="notif-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff453a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="notif-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b4a"/>
      <stop offset="100%" stop-color="#d70015"/>
    </linearGradient>
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Glow -->
  <circle cx="64" cy="64" r="60" fill="url(#notif-glow)"/>

  <!-- Main Body Badge -->
  <circle cx="64" cy="64" r="46" fill="url(#notif-bg)" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>

  <!-- Bell Icon -->
  <g transform="translate(64, 62)" filter="url(#shadow)">
    <!-- Bell Body -->
    <path d="M 0 -22 C -14 -22 -18 -8 -18 4 L -22 10 L 22 10 L 18 4 C 18 -8 14 -22 0 -22 Z" fill="#ffffff"/>
    <!-- Bell Clapper -->
    <circle cx="0" cy="15" r="5" fill="#ffcc00"/>
    <!-- Bell Top Ring -->
    <circle cx="0" cy="-24" r="4" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- Notification Badge (+1) -->
  <g transform="translate(90, 36)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="18" fill="url(#badge-bg)" stroke="#d70015" stroke-width="2.5"/>
    <text x="0" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#d70015" text-anchor="middle">!</text>
  </g>
</svg>
